name: Swift Android
on: [push]
jobs:

  android:
    name: Android
    # swift.org has no Swift 6.3.2 build for Ubuntu 26.04, which ubuntu-latest
    # now is, so the action's toolchain download fails with a 404.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Swift Version
      run: swift --version
    - name: Build and Test
      uses: skiptools/swift-android-action@v2
      with:
        swift-version: 6.3.2
        swift-configuration: ${{ matrix.config }}
        run-tests: true
